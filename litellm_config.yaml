# ============================================================================
# LiteLLM Proxy — Unified Open-Source & Open-Weights AI Gateway
# Global Free-Tier Router & Multi-Provider Load Balancer
# ============================================================================
# Automatically routes all generation requests to the best available free-tier
# endpoints first (Groq free tier, OpenRouter :free, Hugging Face free tier,
# and local Ollama zero-cost GPU/CPU inference) with seamless failover.
# ============================================================================

general_settings:
  master_key: "sk-xennials-playground-dev-key"
  database_url: "sqlite:///litellm_proxy.db"
  alerting: []

litellm_settings:
  num_retries: 3
  request_timeout: 180
  drop_params: true
  set_verbose: false
  telemetry: false

# ---------------------------------------------------------------------------
# Router Settings — Smart Free-Tier Routing & Category Aliases
# ---------------------------------------------------------------------------
router_settings:
  routing_strategy: "latency-based-routing"
  enable_pre_call_checks: true

  model_group_alias:
    # ── Master Default: Always routes to the Best Free Model available ─────
    "default":
      - "free-tier-best"
    "best":
      - "free-tier-best"
    "auto":
      - "free-tier-best"

    # ── Tier 1: Highest Quality Free General Purpose ────────────────────────
    "free-tier-best":
      - "groq-llama-3.3-70b"                # Ultra-fast 70B (Free tier)
      - "openrouter-llama-3.3-70b-free"     # OpenRouter 70B Free
      - "groq-deepseek-r1-70b"              # DeepSeek R1 70B (Free tier)
      - "openrouter-deepseek-r1-free"       # DeepSeek R1 Free
      - "openrouter-gemini-2.0-flash-free"  # Google 2.0 Flash Free
      - "ollama-qwen2.5-latest"             # Local Ollama Qwen 2.5 (100% Free)
      - "ollama-llama-3.3-70b"              # Local Ollama Llama 3.3
      - "ollama-deepseek-coder-latest"      # Local Ollama DeepSeek Coder

    # ── Tier 2: Free Reasoning & Deep Thinking ──────────────────────────────
    "free-tier-reasoning":
      - "groq-deepseek-r1-70b"              # Groq R1 70B (Free)
      - "openrouter-deepseek-r1-free"       # OpenRouter R1 (Free)
      - "ollama-deepseek-r1-14b"            # Local R1 14B
      - "ollama-deepseek-coder-latest"      # Local DeepSeek Coder
      - "ollama-qwen2.5-latest"             # Local Qwen 2.5

    # ── Tier 3: Free Coding & Software Engineering ──────────────────────────
    "free-tier-code":
      - "openrouter-qwen-2.5-coder-free"    # Qwen 2.5 Coder 32B Free
      - "ollama-deepseek-coder-latest"      # Local DeepSeek Coder (Installed)
      - "ollama-qwen2.5-latest"             # Local Qwen 2.5 (Installed)
      - "groq-llama-3.3-70b"                # Groq 70B Free
      - "openrouter-devstral-free"          # Mistral Devstral Free

    # ── Tier 4: Free Ultra-Fast & Low Latency ───────────────────────────────
    "free-tier-fast":
      - "groq-gemma-2-9b"                   # Groq Gemma 2 9B (~300+ tok/s Free)
      - "groq-llama-3.3-70b"                # Groq Llama 3.3 70B (~250+ tok/s Free)
      - "openrouter-gemini-2.0-flash-free"  # OpenRouter Flash Free
      - "ollama-qwen2.5-latest"             # Local Qwen 2.5

    # ── Tier 5: Free Vision & Multimodal ────────────────────────────────────
    "free-tier-vision":
      - "openrouter-gemini-2.0-flash-free"  # Gemini 2.0 Flash Multimodal Free
      - "openrouter-llama-3.2-11b-vision"   # Llama 3.2 11B Vision Free
      - "ollama-llava-13b"                  # Local LLaVA 13B (Ollama)

